name: Windows build and verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      accept_voicevox_terms:
        description: 'I have read and accept the VOICEVOX model and ONNX Runtime terms for the synthesis test'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup update stable
          if ($LASTEXITCODE -ne 0) { throw 'rustup update failed' }
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'rustup default failed' }
          rustup target add x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'rustup target failed' }
          rustc -Vv
          cargo -V
      - name: Resolve dependencies
        shell: pwsh
        run: |
          cargo generate-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Dependency resolution failed' }
      - name: Debug build and unit tests
        shell: pwsh
        run: .\verify.ps1 -SkipAssets
      - name: Release build
        shell: pwsh
        run: |
          cargo build --release --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
      - name: Package executable and runtime
        shell: pwsh
        run: .\package.ps1
      - name: Upload Windows x64 application
        uses: actions/upload-artifact@v4
        with:
          name: zundamon-voicevox-app-windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 30
      # Do not silently accept third-party terms on behalf of repository users.
      - name: Download assets and run real synthesis test
        if: ${{ vars.VOICEVOX_TERMS_ACCEPTED == 'true' || inputs.accept_voicevox_terms == true }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .\setup-assets.ps1 -AcceptTerms -SmokeTest
          $env:VOICEVOX_ASSET_DIR = Join-Path $PWD 'voicevox_core'
          $env:PATH = (Join-Path $PWD 'target/x86_64-pc-windows-msvc/debug') + ';' + $env:PATH
          cargo test --locked --target x86_64-pc-windows-msvc voicevox_smoke -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'VOICEVOX smoke test failed' }
      - name: Upload synthesis test WAV
        if: ${{ vars.VOICEVOX_TERMS_ACCEPTED == 'true' || inputs.accept_voicevox_terms == true }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-wav
          path: smoke-output/
          if-no-files-found: error
          retention-days: 30
      - name: Upload resolved dependency lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock
          if-no-files-found: ignore
